<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | KWTP</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card">

            <!-- Branding -->
            <div class="auth-brand">
                <img src="assets/images/logo.jpeg" alt="KWTP Logo">

                <span>
                    Kingdom Wealth Transfer Program
                </span>
            </div>

            <!-- Heading -->
            <div class="auth-heading">

                <p class="auth-eyebrow">SIGN IN</p>

                <h1>Welcome <span>back.</span></h1>

                <p>Sign in to KWTP.</p>

            </div>

            <!-- Login Form -->
           <form id="login-form" novalidate>

    <!-- Email -->
    <div class="auth-form-group">
        <label for="login-email">Email Address</label>

        <div class="auth-input-wrapper">
            <i class="fa-regular fa-envelope"></i>

            <input
                type="email"
                id="login-email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required>
        </div>
    </div>

    <!-- Password -->
    <div class="auth-form-group">

        <div class="auth-label-row">
            <label for="login-password">Password</label>

            <a href="#" class="forgot-password">
                Forgot password?
            </a>
        </div>

        <div class="auth-input-wrapper">
            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

            <button
                type="button"
                class="password-toggle"
                data-password-toggle="login-password"
                aria-label="Show password">

                <i class="fa-regular fa-eye"></i>
            </button>
        </div>
    </div>

    <!-- Validation Message -->
    <div
        id="login-message"
        class="auth-message"
        role="alert"
        aria-live="polite"
        hidden>
    </div>

    <!-- ONE Sign In Button -->
    <button type="submit" class="login-home-btn home-login-btn">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right"></i>
    </button>

</form>
<!-- Signup Link -->
<div class="auth-switch">

    <p>Don't have an account?</p>

    <a href="signup.html">
        Create an account
    </a>

</div>


            <!-- Footer -->
            <div class="auth-footer">

                <p>© 2026 KWTP. All rights reserved.</p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
