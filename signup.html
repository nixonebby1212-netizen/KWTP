<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | KWTP</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <section class="auth-card signup-card">

            <!-- Branding -->
            <div class="auth-brand">
                <img src="assets/images/logo.jpeg" alt="KWTP Logo">
                <span>Kingdom Wealth Transfer Program</span>
            </div>

            <!-- Heading -->
            <div class="auth-heading">

                <p class="auth-eyebrow">JOIN THE COMMUNITY</p>

                <h1>Create <span>account.</span></h1>

                <p>
                    Begin your journey with the Kingdom Wealth
                    Transfer Program.
                </p>

            </div>

            <!-- Signup Form -->
            <form id="signup-form">

                <!-- Full Name -->
                <div class="auth-form-group">

                    <label for="signup-name">Full Name</label>

                    <div class="auth-input-wrapper">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            id="signup-name"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>

                    </div>

                </div>

                <!-- Email -->
                <div class="auth-form-group">

                    <label for="signup-email">Email Address</label>

                    <div class="auth-input-wrapper">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="signup-email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required>

                    </div>

                </div>

                <!-- Password -->
                <div class="auth-form-group">

                    <label for="signup-password">Create Password</label>

                    <div class="auth-input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="signup-password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle="signup-password"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- Confirm Password -->
                <div class="auth-form-group">

                    <label for="confirm-password">Confirm Password</label>

                    <div class="auth-input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle="confirm-password"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <!-- Terms -->
                <div class="signup-terms">

                    <label>
                        <input type="checkbox" id="signup-terms" required>

                        <span>
                            I agree to the KWTP terms and conditions
                            and privacy policy.
                        </span>
                    </label>

                </div>

                <!-- Submit -->
                <button type="submit" class="auth-submit-btn">

                    Create Account

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>

            <!-- Login Link -->
            <div class="auth-switch">

                <p>Already have an account?</p>

                <a href="login.html">Sign in</a>

            </div>

            <!-- Footer -->
            <div class="auth-footer">

                <p>© 2026 KWTP. All rights reserved.</p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
